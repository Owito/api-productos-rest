# Solo para las pruebas. Spring carga este archivo ademas del application.yml
# de main, y las propiedades de aqui ganan.
#
# Cada clase @SpringBootTest con una configuracion distinta levanta su propio
# contexto, y Spring los mantiene todos vivos en cache durante la suite. Con
# el puerto fijo 9090 el segundo contexto no puede abrir el servidor gRPC
# (Address already in use) y todas sus pruebas fallan al cargar. Con 0 cada
# contexto toma un puerto libre. La prueba del adaptador gRPC ni siquiera lo
# usa: habla por el transporte in-process.
spring.grpc.server.port=0
