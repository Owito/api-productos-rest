<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza(${titulo} ?: 'Error')}"></head>
<body>

<header th:replace="~{fragmentos/comunes :: encabezado('productos')}"></header>

<section class="portada">
	<div class="contenedor">
		<div class="portada__texto">
			<p class="portada__etiqueta" th:text="${codigo} ?: 'Error'">Error</p>
			<h2 th:text="${titulo} ?: 'Algo no salio bien'">Algo no salio bien</h2>
		</div>
		<a class="boton" th:href="@{/productos}">Volver al catalogo</a>
	</div>
</section>

<main class="contenedor">

	<p class="aviso aviso--error" role="alert">
		<span aria-hidden="true">&#9888;</span>
		<span th:text="${mensaje} ?: 'El recurso solicitado no existe.'">El recurso solicitado no existe.</span>
	</p>

	<!-- El remate lo pone quien atiende el error: no es lo mismo un producto que
	     ya no esta que una direccion que nunca existio. -->
	<p th:if="${pista}" th:text="${pista}">Pista sobre que hacer a continuacion.</p>

</main>

<footer th:replace="~{fragmentos/comunes :: pie}"></footer>

</body>
</html>
