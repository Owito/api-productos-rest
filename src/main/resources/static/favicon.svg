<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon del catalogo: el mismo disco del encabezado (.marca__disco), que es
  el unico elemento de marca del sistema de diseno. Base oscura y el verde de
  acento, sin texto, para que se lea a 16 pixeles.

  Lo pide tambien la interfaz de documentacion: Scalar referencia "favicon.svg"
  de forma relativa desde /docs, y sin este archivo esa peticion respondia 404.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Catalogo de Productos">
  <rect width="32" height="32" rx="7" fill="#121212"/>
  <circle cx="16" cy="16" r="10" fill="#1ed760"/>
  <circle cx="16" cy="16" r="3.2" fill="#121212"/>
</svg>
