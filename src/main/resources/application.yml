spring:
  application:
    name: api-productos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema ya no lo genera el ORM sino Flyway. `validate` hace que la
      # aplicacion se niegue a arrancar si la tabla no corresponde al mapeo, en
      # vez de intentar corregirla por su cuenta: un desajuste sale como un
      # fallo de arranque ruidoso y no como una alteracion silenciosa en
      # produccion.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # Migraciones de esquema.
  #
  # El marcador {vendor} elige la carpeta segun el motor: `h2` en el perfil
  # local y `postgresql` en la nube. Hacen falta dos porque el mismo mapeo se
  # traduce distinto en cada dialecto; el detalle esta comentado en los scripts.
  #
  # baseline-on-migrate existe por la base de Neon, que ya tenia la tabla creada
  # por el ORM cuando el proyecto no usaba migraciones. Flyway la adopta
  # marcandola en la version 1 en vez de fallar por encontrar un esquema que no
  # controla, y desde ahi aplica solo lo que venga despues. Consecuencia
  # practica que hay que tener presente al agregar migraciones: lo que se
  # escriba en V1 no se ejecuta en produccion.
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Esquema creado por el ORM antes de que hubiera migraciones
  mvc:
    throw-exception-if-no-handler-found: true
    hiddenmethod:
      filter:
        # Permite que los formularios HTML, que solo soportan GET y POST, emitan
        # PUT y DELETE mediante un campo _method. El adaptador web usa asi los
        # mismos verbos que el adaptador REST.
        enabled: true
  jackson:
    default-property-inclusion: non_null

  # Tercer adaptador de entrada. El esquema se carga de classpath:graphql/ y la
  # aplicacion se niega a arrancar si un campo declarado ahi no tiene quien lo
  # resuelva, asi que un desajuste entre contrato y codigo sale como fallo de
  # arranque y no como un error en tiempo de consulta.
  graphql:
    path: /graphql
    schema:
      locations: classpath:graphql/
      # Publica el esquema efectivo en /graphql/schema. Es documentacion, el
      # equivalente de /v3/api-docs para el lado REST.
      printer:
        enabled: true
    graphiql:
      # Consola interactiva para explorar y probar el esquema desde el
      # navegador, el analogo de Scalar en /docs. Viene empaquetada con el
      # starter, no depende de ninguna CDN externa.
      enabled: true
      path: /graphiql

  # Cuarto adaptador de entrada: servicio gRPC. Corre en un servidor Netty
  # propio, en un puerto distinto del HTTP de Tomcat, para que en la
  # demostracion quede claro que son dos servicios de comunicacion
  # distintos sobre el mismo nucleo. El despliegue en Render sigue
  # publicando solo el puerto HTTP; gRPC se demuestra en local.
  grpc:
    server:
      port: ${GRPC_PORT:9090}
      # Reflexion del servidor: grpcurl y Postman listan el servicio y sus
      # operaciones sin necesitar el .proto. Es documentacion en tiempo de
      # ejecucion, como /graphql/schema para GraphQL.
      reflection:
        enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      # Solo cookies: evita que el identificador de sesion se reescriba en la URL,
      # donde se filtraria por los logs y por la cabecera Referer.
      tracking-modes: cookie
  error:
    include-stacktrace: never    # nunca se filtra la traza de pila al cliente

# Solo el chequeo de salud queda expuesto. La plataforma de despliegue lo usa
# para saber si la instancia esta viva; nada mas del actuator sale a internet.
management:
  endpoints:
    web:
      exposure:
        include: health
      # Sin esto /actuator responde con el indice de enlaces de los endpoints
      # publicados. No filtra nada grave, pero es superficie que no se usa: ni
      # la plataforma ni el workflow de mantenimiento navegan el indice, van
      # directo a la sonda que les toca.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Documentacion de la API, en dos piezas separadas: springdoc genera la
# especificacion OpenAPI a partir de los controladores y la publica en
# /v3/api-docs, y Scalar es la interfaz que la lee y permite probar los
# endpoints desde el navegador en /docs. El porque de Scalar en vez de
# Swagger UI esta en docs/adr/0004-scalar-como-interfaz-de-documentacion.md.
springdoc:
  api-docs:
    path: /v3/api-docs
  # La especificacion describe la API y nada mas: sin este filtro, springdoc
  # tambien documentaria las rutas que la propia interfaz de Scalar publica.
  paths-to-match: /api/v1/**

scalar:
  enabled: true
  path: /docs
  # Ruta relativa: el navegador la resuelve contra el mismo origen, asi que
  # sirve igual en local, en el contenedor y en Render sin tocar la config.
  url: /v3/api-docs
  page-title: API de Productos | Documentacion
  operation-sorter: method
  dark-mode: true
  # La pagina es documentacion, no un banco de trabajo: fuera la barra de
  # herramientas de desarrollo y el generador de servidores MCP.
  show-developer-tools: never
  mcp:
    disabled: true
  # Ni analitica ni asistente de IA: la pagina no habla con servicios de
  # terceros, solo con esta aplicacion.
  telemetry: false
  agent:
    disabled: true
  # Alinea la documentacion con el sistema de diseno de la interfaz web:
  # base oscura y un unico verde de acento.
  custom-css: |
    .dark-mode {
      --scalar-color-accent: #1ed760;
      --scalar-background-1: #121212;
      --scalar-background-2: #181818;
      --scalar-background-3: #242424;
      --scalar-border-color: #2e2e2e;
    }
    .light-mode {
      --scalar-color-accent: #148a3c;
    }

logging:
  level:
    co.edu.poli.productos: INFO

app:
  # Siembra un catalogo de ejemplo si la tabla esta vacia. Apagado por defecto;
  # el perfil local lo enciende y en la nube se pide con APP_DATOS_DEMO=true.
  datos-demo: ${APP_DATOS_DEMO:false}

  # Datos academicos mostrados en /creditos.
  creditos:
    integrantes:
      - Carlos Guerra
      - "Rafael Gutiérrez Correales"
      - "Paulo Reyes Rodríguez"
    programa: Maestria en Arquitectura de Software
    asignatura: Arquitectura de Aplicaciones Web
    codigo-asignatura: TIC51372
    unidad: Unidad 2, actividad sumativa
    tutor: Wilson Soto
    institucion: Politecnico Grancolombiano
    periodo: 2026-2, bloque 1
    fecha-de-entrega: 25 de agosto de 2026
    repositorio: https://github.com/Owito/api-productos-rest
    url-publica: https://api-productos-rest.onrender.com
