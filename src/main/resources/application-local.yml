# Perfil por defecto: base de datos H2 en memoria.
# Permite clonar el repositorio y ejecutar la aplicacion sin configurar nada.
spring:
  datasource:
    url: jdbc:h2:mem:productos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

# Con H2 en memoria la base arranca vacia en cada ejecucion, asi que el catalogo
# de ejemplo se siembra siempre. Quien clone el repositorio ve la aplicacion con
# contenido sin configurar nada.
app:
  datos-demo: true
