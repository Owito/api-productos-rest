# Perfil por defecto: base de datos H2 en memoria.
# Permite clonar el repositorio y ejecutar la aplicacion sin configurar nada.
spring:
  datasource:
    url: jdbc:h2:mem:productos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
