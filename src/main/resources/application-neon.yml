# Perfil de nube: PostgreSQL alojado en Neon (cuenta gratuita).
# Las credenciales nunca se versionan: se inyectan por variables de entorno.
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Neon en capa gratuita suspende el computo por inactividad: la primera
      # conexion despierta la base y puede tardar unos segundos.
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  jpa:
    show-sql: false
