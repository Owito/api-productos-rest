# Plano de infraestructura para Render.
#
# Con este archivo el despliegue se crea desde "New > Blueprint" apuntando al
# repositorio, en vez de llenar el formulario a mano. Queda versionado, asi que
# el servicio es reproducible y los cambios de configuracion pasan por revision.

services:
  - type: web
    name: api-productos-rest
    runtime: docker
    plan: free
    # Ohio es la region de Render mas cercana a la base de datos de Neon, que
    # esta en us-east-2. Elegir otra agrega latencia en cada consulta.
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    # Liveness y no /actuator/health a secas. El health compuesto incluye el
    # indicador de la base de datos, que lanza una consulta de validacion; si la
    # computacion de Neon esta suspendida esa consulta se queda esperando
    # mientras la base despierta, la sonda no responde a tiempo y Render da el
    # despliegue por fallido aunque la aplicacion este perfectamente viva.
    #
    # Un chequeo de plataforma responde "este proceso esta vivo, no lo
    # reinicies", no "la base de datos esta despierta". Para lo segundo esta
    # /actuator/health, que sigue expuesto y es el que pinga el workflow de
    # mantenimiento: asi ese ping mantiene caliente tambien a Neon.
    healthCheckPath: /actuator/health/liveness
    # Solo surte efecto si el repositorio esta conectado por la aplicacion de
    # GitHub de Render. Conectado por URL publica, Render no puede instalar el
    # webhook y los despliegues se disparan a mano. Ver docs/DESPLIEGUE.md.
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: neon

      # Siembra el catalogo de ejemplo si la tabla esta vacia.
      - key: APP_DATOS_DEMO
        value: "true"

      - key: DB_URL
        value: jdbc:postgresql://ep-broad-hill-axib2mo6.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require

      - key: DB_USERNAME
        value: neondb_owner

      # sync: false hace que Render pida el valor al crear el plano y lo guarde
      # cifrado. La contrasena nunca entra al repositorio.
      - key: DB_PASSWORD
        sync: false
